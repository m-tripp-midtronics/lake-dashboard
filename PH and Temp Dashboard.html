    color: #a8f0c0;
    padding: 12px 20px;
    border-radius: 8px;
    font-size: 0.85rem;
    font-weight: 600;
    opacity: 0;
    transform: translateY(-10px);

    pointer-events: none;
    z-index: 1000;

  #toast.show { opacity: 1; transform: translateY(0); }

    grid-template-columns: repeat(4, 1fr);

    padding: 20px 32px;

  .stat-card {
    background: #132435;

<script>
// ── Seed data (last known snapshot) ─────────────────────────────────────────

  {date:"2026-07-17",time:"7:00 AM", brPh:8.08, brTemp:84.2, npPh:8.07, npTemp:84.5},
  {date:"2026-07-19",time:"1:04 PM", brPh:8.14, brTemp:83.3, npPh:7.84, npTemp:84.2},
  {date:"2026-07-20",time:"7:57 AM", brPh:7.75, brTemp:80.9, npPh:7.8, npTemp:82.2},
  {date:"2026-07-21",time:"8:59 AM", brPh:7.71, brTemp:80.7, npPh:7.71, npTemp:80.6},
  {date:"2026-07-23",time:"7:48 AM", brPh:7.72, brTemp:76.8, npPh:7.89, npTemp:77.3}
];

let RAW = [];
let currentView = 'all';
let currentLocation = 'both';
let currentRange = 'all';
let charts = {};

// ── File loading ─────────────────────────────────────────────────────────────
document.getElementById('fileInput').addEventListener('change', function(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(ev) {
    try {
      const wb = XLSX.read(ev.target.result, { type: 'array', cellDates: true });
      const ws = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(ws, { header: 1, raw: false, dateNF: 'yyyy-mm-dd' });
      const parsed = parseRows(rows);
      if (parsed.length === 0) throw new Error('No valid rows found');
      RAW = parsed;
      saveToStorage(RAW);
      document.getElementById('lastUpdated').textContent =
        'Updated from file · ' + new Date().toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric',hour:'numeric',minute:'2-digit'});
      updateAll();
      showToast('✓ Loaded ' + parsed.length + ' readings from ' + file.name);
    } catch(err) {
      showToast('⚠ Could not read file: ' + err.message, true);
    }
  };
  reader.readAsArrayBuffer(file);
  this.value = ''; // allow re-selecting same file
});

function parseRows(rows) {
  const result = [];
  // Skip header row(s) — find first row where col[0] looks like a date
  for (let i = 1; i < rows.length; i++) {
    const r = rows[i];
    if (!r || r.length < 6) continue;
    const rawDate = r[0], rawTime = r[1];
    const brPh = parseFloat(r[2]), brTemp = parseFloat(r[3]);
    const npPh = parseFloat(r[4]), npTemp = parseFloat(r[5]);
    const llPh = r[6] !== undefined && r[6] !== '' ? parseFloat(r[6]) : null;
    const llTemp = r[7] !== undefined && r[7] !== '' ? parseFloat(r[7]) : null;
    if (isNaN(brPh) || isNaN(brTemp) || isNaN(npPh) || isNaN(npTemp)) continue;

    // Parse date — may come as Date object, serial, or string
    let dateStr;
    if (rawDate instanceof Date) {
      dateStr = rawDate.toISOString().slice(0, 10);
    } else if (typeof rawDate === 'number') {
      // Excel serial
      const d = XLSX.SSF.parse_date_code(rawDate);
      dateStr = `${d.y}-${String(d.m).padStart(2,'0')}-${String(d.d).padStart(2,'0')}`;
    } else {
      // Try to parse string like "Tuesday, June 16, 2026"
      const d = new Date(String(rawDate));
      if (isNaN(d)) continue;
      dateStr = d.toISOString().slice(0, 10);
    }

    // Parse time string
    let timeStr = String(rawTime || '').trim();
    // Handle "7:19:00 AM" → "7:19 AM"
    timeStr = timeStr.replace(/^(\d+:\d+):\d+\s*(AM|PM)$/i, '$1 $2').toUpperCase();
    if (!timeStr) timeStr = '12:00 PM';

    result.push({ date: dateStr, time: timeStr, brPh, brTemp, npPh, npTemp, llPh, llTemp });
  }
  return result;
}

// ── LocalStorage persistence ─────────────────────────────────────────────────
function saveToStorage(data) {
  try { localStorage.setItem('lakeData', JSON.stringify(data)); } catch(e) {}
}
function loadFromStorage() {
  try {
    const s = localStorage.getItem('lakeData');
    return s ? JSON.parse(s) : null;
  } catch(e) { return null; }
}

// ── Augment rows with computed fields ────────────────────────────────────────
function augment(data) {
  return data.map(r => {
    const parts = r.time.match(/^(\d+):(\d+)\s*(AM|PM)$/i);
    let hour = parts ? parseInt(parts[1]) : 12;
    const ampm = parts ? parts[3].toUpperCase() : 'AM';
    if (ampm === 'PM' && hour !== 12) hour += 12;
    if (ampm === 'AM' && hour === 12) hour = 0;
    return {
      ...r,
      session: hour < 12 ? 'AM' : 'PM',
      label: new Date(r.date + 'T12:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric'}) + ' ' + r.time
    };
  });
}

// ── Toast ────────────────────────────────────────────────────────────────────
function showToast(msg, isError = false) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'show' + (isError ? ' error' : '');
  setTimeout(() => t.className = '', 3000);
}

// ── Filter helpers ───────────────────────────────────────────────────────────
function rangeFilteredData(data) {
  if (currentRange === 'all') return data;
  const sorted = [...data].sort((a,b) => a.date.localeCompare(b.date));
  const lastDate = new Date(sorted[sorted.length-1].date + 'T12:00:00');
  const days = currentRange === '7d' ? 7 : 30;
  const cutoff = new Date(lastDate);
  cutoff.setDate(cutoff.getDate() - days);
  return data.filter(r => new Date(r.date + 'T12:00:00') >= cutoff);
}

function filteredData(data) {
  return rangeFilteredData(data).filter(r => {
    if (currentView === 'am') return r.session === 'AM';
    if (currentView === 'pm') return r.session === 'PM';
    return true;
  });
}
function avg(arr) { return arr.length ? arr.reduce((a,b)=>a+b,0)/arr.length : 0; }

// ── Linear regression slope ──────────────────────────────────────────────────
function slope(vals) {
  if (vals.length < 2) return 0;
  const n = vals.length;
  const xs = vals.map((_,i) => i);
  const mx = avg(xs), my = avg(vals);
  const num = xs.reduce((s,x,i) => s + (x-mx)*(vals[i]-my), 0);
  const den = xs.reduce((s,x) => s + (x-mx)**2, 0);
  return den === 0 ? 0 : num/den;
}

// ── Trend banner ─────────────────────────────────────────────────────────────
function updateTrend(data) {
  const rd = rangeFilteredData(data);
  if (rd.length < 2) { document.getElementById('trendBanner').innerHTML = ''; return; }

  const sorted = [...rd].sort((a,b) => a.date.localeCompare(b.date) || a.time.localeCompare(b.time));

  const llSorted = sorted.filter(r=>r.llPh != null);
  const brPhSlope   = slope(sorted.map(r=>r.brPh));
  const npPhSlope   = slope(sorted.map(r=>r.npPh));
  const llPhSlope   = slope(llSorted.map(r=>r.llPh));
  const brTempSlope = slope(sorted.map(r=>r.brTemp));
  const npTempSlope = slope(sorted.map(r=>r.npTemp));
  const llTempSlope = slope(llSorted.map(r=>r.llTemp));

  const rangeLabel = currentRange === '7d' ? 'Last 7 days' : currentRange === '30d' ? 'Last 30 days' : 'All time';

  function trendHtml(label, val, s, isTemp) {
    if (val == null || isNaN(val)) return '';
    const thresh = isTemp ? 0.05 : 0.003;
    let arrow, cls, desc;
    if (s > thresh)       { arrow='↑'; cls=isTemp?'trend-temp-up':'trend-up';     desc=isTemp?'Warming':'Rising'; }
    else if (s < -thresh) { arrow='↓'; cls=isTemp?'trend-temp-down':'trend-down'; desc=isTemp?'Cooling':'Falling'; }
    else                  { arrow='→'; cls='trend-stable';                         desc='Stable'; }
    const unit = isTemp ? '°F' : '';
    return `<div class="trend-item ${cls}">
      <div class="trend-arrow">${arrow}</div>
      <div class="trend-info">
        <div class="trend-label">${label}</div>
        <div class="trend-value">${val.toFixed(isTemp?1:2)}${unit}</div>
        <div class="trend-desc">${desc} · ${rangeLabel}</div>
      </div>
    </div>`;
  }

  const llPhAvg   = llSorted.length ? avg(llSorted.map(r=>r.llPh))   : null;
  const llTempAvg = llSorted.length ? avg(llSorted.map(r=>r.llTemp)) : null;

  document.getElementById('trendBanner').innerHTML =
    trendHtml('Boat Ramp pH',    avg(sorted.map(r=>r.brPh)),   brPhSlope,   false) +
    trendHtml('North Pier pH',   avg(sorted.map(r=>r.npPh)),   npPhSlope,   false) +
    trendHtml('Little Lake pH',  llPhAvg,                      llPhSlope,   false) +
    trendHtml('Boat Ramp Temp',  avg(sorted.map(r=>r.brTemp)), brTempSlope, true)  +
    trendHtml('North Pier Temp', avg(sorted.map(r=>r.npTemp)), npTempSlope, true)  +
    trendHtml('Little Lake Temp',llTempAvg,                    llTempSlope, true);
}

// ── View / location / range toggles ─────────────────────────────────────────
function setRange(v, e) {
  currentRange = v;
  document.querySelectorAll('.controls .range-btn').forEach(b => b.classList.remove('active'));
  e.target.classList.add('active');
  updateAll();
}
function setView(v, e) {
  currentView = v;
  document.querySelectorAll('.controls .view-btn').forEach(b => b.classList.remove('active'));
  e.target.classList.add('active');
  updateAll();
}
function setLocation(l, e) {
  currentLocation = l;
  document.querySelectorAll('.controls .loc-btn').forEach(b => b.classList.remove('active'));
  e.target.classList.add('active');
  updateAll();
}

// ── Chart colors ─────────────────────────────────────────────────────────────
const C = {
  br: { ph:'#3ec6a1', temp:'#26a884', phFill:'rgba(62,198,161,0.15)', tempFill:'rgba(62,198,161,0.1)' },
  np: { ph:'#e07052', temp:'#c0503a', phFill:'rgba(224,112,82,0.15)', tempFill:'rgba(224,112,82,0.1)' },
  ll: { ph:'#a78bfa', temp:'#7c5cbf', phFill:'rgba(167,139,250,0.15)', tempFill:'rgba(167,139,250,0.1)' },
};

const baseOpts = {
  responsive:true, maintainAspectRatio:false,
  plugins:{ legend:{labels:{color:'#b0cfe8',font:{size:12}}}, tooltip:{mode:'index',intersect:false} },
  scales:{
    x:{ticks:{color:'#7fb3d3',font:{size:10},maxRotation:30},grid:{color:'rgba(255,255,255,0.05)'}},
    y:{ticks:{color:'#7fb3d3'},grid:{color:'rgba(255,255,255,0.07)'}}
  },
  elements:{line:{tension:0.3,borderWidth:2},point:{radius:4,hoverRadius:6}}
};

function deepMerge(a, b) { return Object.assign({}, a, b); }

function makeOrUpdate(id, type, data, options) {
  if (charts[id]) charts[id].destroy();
  charts[id] = new Chart(document.getElementById(id), { type, data, options });
}

// ── Build DOM ────────────────────────────────────────────────────────────────
function buildDOM() {
  document.getElementById('mainContent').innerHTML = `
    <div class="charts-grid">
      <div class="chart-card full-width">
        <h3>pH Over Time</h3>
        <div class="chart-wrap tall"><canvas id="phChart"></canvas></div>
      </div>
      <div class="chart-card full-width">
        <h3>Temperature Over Time (°F)</h3>
        <div class="chart-wrap tall"><canvas id="tempChart"></canvas></div>
      </div>
      <div class="chart-card">
        <h3>Morning vs Afternoon — pH</h3>
        <div class="chart-wrap"><canvas id="ampmPhChart"></canvas></div>
      </div>
      <div class="chart-card">
        <h3>Morning vs Afternoon — Temperature</h3>
        <div class="chart-wrap"><canvas id="ampmTempChart"></canvas></div>
      </div>
      <div class="chart-card">
        <h3>Boat Ramp vs North Pier — pH</h3>
        <div class="chart-wrap"><canvas id="locationPhChart"></canvas></div>
      </div>
      <div class="chart-card">
        <h3>Boat Ramp vs North Pier — Temperature</h3>
        <div class="chart-wrap"><canvas id="locationTempChart"></canvas></div>
      </div>
    </div>
    <div class="table-wrap">
      <h3>Raw Data</h3>
      <table>
        <thead>
          <tr>
            <th>Date</th><th>Time</th><th>Session</th>
            <th>Boat Ramp pH</th><th>Boat Ramp Temp</th>
            <th>North Pier pH</th><th>North Pier Temp</th>
            <th>Little Lake pH</th><th>Little Lake Temp</th>
          </tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>`;
}

// ── Update functions ─────────────────────────────────────────────────────────
function updateStats(data) {
  const fd = filteredData(data);
  const brPh=fd.map(r=>r.brPh), npPh=fd.map(r=>r.npPh);
  const llPh=fd.map(r=>r.llPh).filter(v=>v!=null), llTemp=fd.map(r=>r.llTemp).filter(v=>v!=null);
  const brTemp=fd.map(r=>r.brTemp), npTemp=fd.map(r=>r.npTemp);
  const allPh=[...brPh,...npPh,...llPh], allTemp=[...brTemp,...npTemp,...llTemp];
  if (!allPh.length) { document.getElementById('statsRow').innerHTML=''; return; }
  const cards = [
    {label:'Avg pH',       value:avg(allPh).toFixed(2),          sub:`Range ${Math.min(...allPh).toFixed(2)}–${Math.max(...allPh).toFixed(2)}`,   cls:'ph-color'},
    {label:'Avg Temp',     value:avg(allTemp).toFixed(1)+'°',    sub:`Range ${Math.min(...allTemp).toFixed(1)}–${Math.max(...allTemp).toFixed(1)}°F`, cls:'temp-color'},
    {label:'Boat Ramp pH', value:avg(brPh).toFixed(2),           sub:`Temp avg ${avg(brTemp).toFixed(1)}°F`, cls:'br-color'},
    {label:'North Pier pH',value:avg(npPh).toFixed(2),           sub:`Temp avg ${avg(npTemp).toFixed(1)}°F`, cls:'np-color'},
  ];
  if (llPh.length) cards.push({label:'Little Lake pH', value:avg(llPh).toFixed(2), sub:`Temp avg ${avg(llTemp).toFixed(1)}°F`, cls:'ph-color'});
  document.getElementById('statsRow').style.gridTemplateColumns = `repeat(${cards.length}, 1fr)`;
  document.getElementById('statsRow').innerHTML = cards.map(s=>`<div class="stat-card"><div class="label">${s.label}</div><div class="value ${s.cls}">${s.value}</div><div class="sub">${s.sub}</div></div>`).join('');
}

function updateTimeSeries(data) {
  const fd = filteredData(data);
  const labels = fd.map(r=>r.label);

  function ds(type) {
    const sets = [];
    const showAll = currentLocation === 'both';
    if (showAll || currentLocation === 'br') sets.push({label:'Boat Ramp',   data:fd.map(r=>type==='ph'?r.brPh:r.brTemp), borderColor:C.br[type], backgroundColor:C.br[type+'Fill'], fill:true, spanGaps:true});
    if (showAll || currentLocation === 'np') sets.push({label:'North Pier',  data:fd.map(r=>type==='ph'?r.npPh:r.npTemp), borderColor:C.np[type], backgroundColor:C.np[type+'Fill'], fill:true, spanGaps:true});
    if (showAll || currentLocation === 'll') sets.push({label:'Little Lake', data:fd.map(r=>type==='ph'?r.llPh:r.llTemp),  borderColor:C.ll[type], backgroundColor:C.ll[type+'Fill'], fill:true, spanGaps:true});
    return {labels, datasets:sets};
  }

  const xOpts = {...baseOpts.scales.x};
  const phs = fd.flatMap(r=>[r.brPh,r.npPh,r.llPh]).filter(v=>v!=null&&!isNaN(v));
  const phMin = Math.floor((Math.min(...phs)-0.1)*100)/100, phMax = Math.ceil((Math.max(...phs)+0.1)*100)/100;
  makeOrUpdate('phChart','line', ds('ph'), {...baseOpts, scales:{x:xOpts, y:{min:phMin,max:phMax,ticks:{color:'#7fb3d3',callback:v=>v.toFixed(2)},grid:{color:'rgba(255,255,255,0.07)'}}}});
  const temps = fd.flatMap(r=>[r.brTemp,r.npTemp,r.llTemp]).filter(v=>v!=null&&v>30);
  const tMin = Math.floor(Math.min(...temps) - 2), tMax = Math.ceil(Math.max(...temps) + 2);
  makeOrUpdate('tempChart','line', ds('temp'), {...baseOpts, scales:{x:xOpts, y:{min:tMin,max:tMax,ticks:{color:'#7fb3d3',callback:v=>v+'°F'},grid:{color:'rgba(255,255,255,0.07)'}}}});
}

function updateAmPm(data) {
  const fd = filteredData(data);
  const am = fd.filter(r=>r.session==='AM'), pm = fd.filter(r=>r.session==='PM');
  const hasLL = fd.some(r=>r.llPh!=null);
  const locs = hasLL ? ['Boat Ramp','North Pier','Little Lake'] : ['Boat Ramp','North Pier'];
  const barOpts = {responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{color:'#b0cfe8',font:{size:12}}}},scales:{x:{ticks:{color:'#7fb3d3'},grid:{color:'rgba(255,255,255,0.05)'}},y:{ticks:{color:'#7fb3d3'},grid:{color:'rgba(255,255,255,0.07)'}}}};

  const amPhData  = [avg(am.map(r=>r.brPh)), avg(am.map(r=>r.npPh))];
  const pmPhData  = [avg(pm.map(r=>r.brPh)), avg(pm.map(r=>r.npPh))];
  const amTmpData = [avg(am.map(r=>r.brTemp)), avg(am.map(r=>r.npTemp))];
  const pmTmpData = [avg(pm.map(r=>r.brTemp)), avg(pm.map(r=>r.npTemp))];
  if (hasLL) {
    amPhData.push(avg(am.filter(r=>r.llPh!=null).map(r=>r.llPh)));
    pmPhData.push(avg(pm.filter(r=>r.llPh!=null).map(r=>r.llPh)));
    amTmpData.push(avg(am.filter(r=>r.llTemp!=null).map(r=>r.llTemp)));
    pmTmpData.push(avg(pm.filter(r=>r.llTemp!=null).map(r=>r.llTemp)));
  }

  const allPh = [...amPhData,...pmPhData].filter(v=>v>0);
  const phMin = allPh.length ? Math.floor((Math.min(...allPh)-0.1)*10)/10 : 8;
  const allTm = [...amTmpData,...pmTmpData].filter(v=>v>0);
  const tmMin = allTm.length ? Math.floor(Math.min(...allTm)-2) : 60;

  makeOrUpdate('ampmPhChart','bar',{labels:locs,datasets:[
    {label:'Morning Avg',   data:amPhData,  backgroundColor:'rgba(82,196,224,0.7)', borderColor:'#52c4e0',borderWidth:1.5},
    {label:'Afternoon Avg', data:pmPhData,  backgroundColor:'rgba(240,165,0,0.7)',  borderColor:'#f0a500',borderWidth:1.5},
  ]},{...barOpts,scales:{...barOpts.scales,y:{min:phMin,ticks:{color:'#7fb3d3',callback:v=>v.toFixed(2)},grid:{color:'rgba(255,255,255,0.07)'}}}});

  makeOrUpdate('ampmTempChart','bar',{labels:locs,datasets:[
    {label:'Morning Avg',   data:amTmpData, backgroundColor:'rgba(82,196,224,0.7)', borderColor:'#52c4e0',borderWidth:1.5},
    {label:'Afternoon Avg', data:pmTmpData, backgroundColor:'rgba(240,165,0,0.7)',  borderColor:'#f0a500',borderWidth:1.5},
  ]},{...barOpts,scales:{...barOpts.scales,y:{min:tmMin,ticks:{color:'#7fb3d3',callback:v=>v+'°F'},grid:{color:'rgba(255,255,255,0.07)'}}}});
}

function updateScatter(data) {
  const fd = filteredData(data);
  const scatterOpts = {
    responsive:true,maintainAspectRatio:false,
    plugins:{legend:{labels:{color:'#b0cfe8',font:{size:12}}}},
    scales:{
      x:{ticks:{color:'#7fb3d3'},grid:{color:'rgba(255,255,255,0.05)'}},
      y:{ticks:{color:'#7fb3d3'},grid:{color:'rgba(255,255,255,0.07)'}}
    }
  };

  const llRows = fd.filter(r=>r.llPh!=null);
  const phDS = [
    {label:'BR vs NP',          data:fd.map(r=>({x:r.brPh,y:r.npPh})),                               backgroundColor:'#52c4e0',pointRadius:5},
  ];
  if (llRows.length) phDS.push({label:'BR vs Little Lake', data:llRows.map(r=>({x:r.brPh,y:r.llPh})), backgroundColor:'#a78bfa',pointRadius:5});

  const tmpDS = [
    {label:'BR vs NP',          data:fd.map(r=>({x:r.brTemp,y:r.npTemp})),                                   backgroundColor:'#f0a500',pointRadius:5},
  ];
  if (llRows.length) tmpDS.push({label:'BR vs Little Lake', data:llRows.map(r=>({x:r.brTemp,y:r.llTemp})),   backgroundColor:'#a78bfa',pointRadius:5});

  makeOrUpdate('locationPhChart','scatter',{datasets:phDS},{...scatterOpts,scales:{
    x:{...scatterOpts.scales.x,title:{display:true,text:'Boat Ramp pH',color:'#3ec6a1'},ticks:{color:'#7fb3d3',callback:v=>v.toFixed(2)},grid:{color:'rgba(255,255,255,0.05)'}},
    y:{...scatterOpts.scales.y,title:{display:true,text:'North Pier / Little Lake pH',color:'#e07052'},ticks:{color:'#7fb3d3',callback:v=>v.toFixed(2)},grid:{color:'rgba(255,255,255,0.07)'}}
  }});

  makeOrUpdate('locationTempChart','scatter',{datasets:tmpDS},{...scatterOpts,scales:{
    x:{...scatterOpts.scales.x,title:{display:true,text:'Boat Ramp (°F)',color:'#3ec6a1'},ticks:{color:'#7fb3d3',callback:v=>v+'°'},grid:{color:'rgba(255,255,255,0.05)'}},
    y:{...scatterOpts.scales.y,title:{display:true,text:'North Pier / Little Lake (°F)',color:'#e07052'},ticks:{color:'#7fb3d3',callback:v=>v+'°'},grid:{color:'rgba(255,255,255,0.07)'}}
  }});
}

function updateTable(data) {
  const fd = filteredData(data);
  document.getElementById('tableBody').innerHTML = fd.map(r=>`
    <tr class="${r.session==='AM'?'morning':'afternoon'}">
      <td>${new Date(r.date+'T12:00:00').toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric',year:'numeric'})}</td>
      <td>${r.time}</td>
      <td><span class="badge ${r.session==='AM'?'badge-am':'badge-pm'}">${r.session==='AM'?'☀️ Morning':'🌤 Afternoon'}</span></td>
      <td style="color:#3ec6a1;font-weight:600">${r.brPh.toFixed(2)}</td>
      <td style="color:#f0a500">${r.brTemp.toFixed(1)}°F</td>
      <td style="color:#e07052;font-weight:600">${r.npPh.toFixed(2)}</td>
      <td style="color:#f0a500">${r.npTemp.toFixed(1)}°F</td>
      <td style="color:#a78bfa;font-weight:600">${r.llPh!=null?r.llPh.toFixed(2):'—'}</td>
      <td style="color:#f0a500">${r.llTemp!=null?r.llTemp.toFixed(1)+'°F':'—'}</td>
    </tr>`).join('');
}

function updateAll() {
  const data = augment(RAW);
  updateTrend(data);
  updateStats(data);
  updateTimeSeries(data);
  updateAmPm(data);
  updateScatter(data);
  updateTable(data);
}

// ── Init ──────────────────────────────────────────────────────────────────────
const stored = loadFromStorage();
if (stored && stored.length > 0) {
  RAW = stored;
  document.getElementById('lastUpdated').textContent = 'Loaded from last session · ' +
    new Date(RAW[RAW.length-1].date).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
} else {
  RAW = SEED;
  document.getElementById('lastUpdated').textContent =
    'Showing built-in data · last reading ' +
    new Date(SEED[SEED.length-1].date).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
}

buildDOM();
updateAll();
</script>
